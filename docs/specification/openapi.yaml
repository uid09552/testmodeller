openapi: 3.1.0
info:
  title: TestModeller API
  version: 0.1.0
  description: >
    Contract between the Angular UI and the Rust backend. Changes require explicit approval (see AGENTS.md).
    Hierarchy: Project > Component > Feature > Model. A Feature has a scenario description and one or more Models
    (state machines). Test cases belong to a Feature and are assigned to Model states or transitions (steps).
servers:
  - url: /api/v1
tags:
  - name: System
  - name: Projects
  - name: Components
  - name: Features
  - name: Models
  - name: States
  - name: Transitions
  - name: TestCases
  - name: Assignments
  - name: Generation
  - name: Coverage
  - name: Traceability
  - name: TestResults
  - name: Export
  - name: AI
  - name: Settings
  - name: ThreatModel

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness/readiness
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }

  /projects:
    get:
      tags: [Projects]
      summary: List projects
      parameters: [ { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: Page of projects, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectPage' } } } }
    post:
      tags: [Projects]
      summary: Create project
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    get:
      tags: [Projects]
      summary: Get project
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Projects]
      summary: Update project
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Projects]
      summary: Delete project and all its contents
      responses:
        '204': { description: Deleted }
  /projects/{projectId}/tree:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    get:
      tags: [Projects]
      summary: Component > Feature > Model tree for the explorer
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectTree' } } } }
  /projects/{projectId}/search:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    get:
      tags: [Projects]
      summary: Search components, features, models and test cases
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: types, in: query, schema: { type: array, items: { type: string, enum: [component, feature, model, testCase] } } }
      responses:
        '200': { description: Hits, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SearchHit' } } } } }

  /projects/{projectId}/components:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    get:
      tags: [Components]
      summary: List components
      parameters: [ { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ComponentPage' } } } }
    post:
      tags: [Components]
      summary: Create component
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ComponentInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Component' } } } }
  /components/{componentId}:
    parameters: [ { $ref: '#/components/parameters/ComponentId' } ]
    get:
      tags: [Components]
      summary: Get component
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Component' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Components]
      summary: Update component
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ComponentInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Component' } } } }
        '412': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Components]
      summary: Delete component (409 if it has features unless cascade=true)
      parameters: [ { $ref: '#/components/parameters/Cascade' } ]
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Problem' }

  /components/{componentId}/features:
    parameters: [ { $ref: '#/components/parameters/ComponentId' } ]
    get:
      tags: [Features]
      summary: List features of a component
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: tag, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FeaturePage' } } } }
    post:
      tags: [Features]
      summary: Create feature
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeatureInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Feature' } } } }
  /features/{featureId}:
    parameters: [ { $ref: '#/components/parameters/FeatureId' } ]
    get:
      tags: [Features]
      summary: Get feature including its scenario description
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Feature' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Features]
      summary: Update feature (name, description, scenarioDescription, tags)
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeatureInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Feature' } } } }
        '412': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Features]
      summary: Delete feature (409 if it has models or test cases unless cascade=true)
      parameters: [ { $ref: '#/components/parameters/Cascade' } ]
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Problem' }
  /features/{featureId}/move:
    parameters: [ { $ref: '#/components/parameters/FeatureId' } ]
    post:
      tags: [Features]
      summary: Move feature to another component
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [componentId], properties: { componentId: { $ref: '#/components/schemas/Id' } } } } }
      responses:
        '200': { description: Moved, content: { application/json: { schema: { $ref: '#/components/schemas/Feature' } } } }

  /features/{featureId}/models:
    parameters: [ { $ref: '#/components/parameters/FeatureId' } ]
    get:
      tags: [Models]
      summary: List models of a feature (summaries)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ModelSummary' } } } } }
    post:
      tags: [Models]
      summary: Create model (optionally with states and transitions)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ModelInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Model' } } } }
  /models/{modelId}:
    parameters: [ { $ref: '#/components/parameters/ModelId' } ]
    get:
      tags: [Models]
      summary: Get full model with states and transitions
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Model' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Models]
      summary: Replace whole model graph atomically (editor save)
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ModelInput' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Model' } } } }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Models]
      summary: Update model metadata only (name, description, status)
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ModelMetaInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ModelSummary' } } } }
        '412': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Models]
      summary: Delete model (assignments are removed, test cases kept)
      responses:
        '204': { description: Deleted }
  /models/{modelId}/duplicate:
    parameters: [ { $ref: '#/components/parameters/ModelId' } ]
    post:
      tags: [Models]
      summary: Duplicate model, optionally into another feature
      requestBody:
        content: { application/json: { schema: { type: object, properties: { name: { type: string }, featureId: { $ref: '#/components/schemas/Id' } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Model' } } } }
  /models/{modelId}/validate:
    parameters: [ { $ref: '#/components/parameters/ModelId' } ]
    post:
      tags: [Models]
      summary: Validate stored model, or a draft graph if a body is given
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ModelInput' } } }
      responses:
        '200': { description: Issues (empty if valid), content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } } } } }
  /models/{modelId}/versions:
    parameters: [ { $ref: '#/components/parameters/ModelId' } ]
    get:
      tags: [Models]
      summary: Version history
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ModelVersion' } } } } }
  /models/{modelId}/versions/{version}/restore:
    parameters:
      - { $ref: '#/components/parameters/ModelId' }
      - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [Models]
      summary: Restore a previous version as a new version
      responses:
        '200': { description: Restored, content: { application/json: { schema: { $ref: '#/components/schemas/Model' } } } }

  /models/{modelId}/states:
    parameters: [ { $ref: '#/components/parameters/ModelId' } ]
    get:
      tags: [States]
      summary: List states
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/State' } } } } }
    post:
      tags: [States]
      summary: Add state
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StateInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/State' } } } }
  /states/{stateId}:
    parameters: [ { $ref: '#/components/parameters/StateId' } ]
    get:
      tags: [States]
      summary: Get state
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/State' } } } }
    patch:
      tags: [States]
      summary: Update state
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StateInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/State' } } } }
    delete:
      tags: [States]
      summary: Delete state and its incident transitions
      responses:
        '204': { description: Deleted }

  /models/{modelId}/transitions:
    parameters: [ { $ref: '#/components/parameters/ModelId' } ]
    get:
      tags: [Transitions]
      summary: List transitions (model steps)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Transition' } } } } }
    post:
      tags: [Transitions]
      summary: Add transition
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransitionInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Transition' } } } }
  /transitions/{transitionId}:
    parameters: [ { $ref: '#/components/parameters/TransitionId' } ]
    get:
      tags: [Transitions]
      summary: Get transition
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Transition' } } } }
    patch:
      tags: [Transitions]
      summary: Update transition
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransitionInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Transition' } } } }
    delete:
      tags: [Transitions]
      summary: Delete transition
      responses:
        '204': { description: Deleted }

  /features/{featureId}/test-cases:
    parameters: [ { $ref: '#/components/parameters/FeatureId' } ]
    get:
      tags: [TestCases]
      summary: List test cases of a feature
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: modelId, in: query, description: Only test cases assigned to this model, schema: { $ref: '#/components/schemas/Id' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TestCaseStatus' } }
        - { name: origin, in: query, schema: { $ref: '#/components/schemas/Origin' } }
        - { name: unassigned, in: query, description: Only test cases without any assignment, schema: { type: boolean } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TestCasePage' } } } }
    post:
      tags: [TestCases]
      summary: Create test case manually
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TestCaseInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TestCase' } } } }
  /test-cases/{testCaseId}:
    parameters: [ { $ref: '#/components/parameters/TestCaseId' } ]
    get:
      tags: [TestCases]
      summary: Get test case with steps and assignments
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TestCase' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [TestCases]
      summary: Replace test case including steps
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TestCaseInput' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/TestCase' } } } }
        '412': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [TestCases]
      summary: Delete test case
      responses:
        '204': { description: Deleted }
  /test-cases/{testCaseId}/results:
    parameters: [ { $ref: '#/components/parameters/TestCaseId' } ]
    get:
      tags: [TestResults]
      summary: Result history of a test case, newest first
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TestResult' } } } } }
  /test-cases/{testCaseId}/move:
    parameters: [ { $ref: '#/components/parameters/TestCaseId' } ]
    post:
      tags: [TestCases]
      summary: Move test case to another feature (assignments are cleared)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [featureId], properties: { featureId: { $ref: '#/components/schemas/Id' } } } } }
      responses:
        '200': { description: Moved, content: { application/json: { schema: { $ref: '#/components/schemas/TestCase' } } } }

  /test-cases/{testCaseId}/assignments:
    parameters: [ { $ref: '#/components/parameters/TestCaseId' } ]
    get:
      tags: [Assignments]
      summary: List where this test case is assigned
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Assignment' } } } } }
    put:
      tags: [Assignments]
      summary: Replace all assignments of the test case
      requestBody:
        required: true
        content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AssignmentInput' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Assignment' } } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /states/{stateId}/test-cases:
    parameters: [ { $ref: '#/components/parameters/StateId' } ]
    get:
      tags: [Assignments]
      summary: Test cases assigned to a state
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TestCase' } } } } }
  /states/{stateId}/test-cases/{testCaseId}:
    parameters: [ { $ref: '#/components/parameters/StateId' }, { $ref: '#/components/parameters/TestCaseId' } ]
    put:
      tags: [Assignments]
      summary: Assign test case to state (idempotent)
      responses:
        '204': { description: Assigned }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Assignments]
      summary: Remove assignment
      responses:
        '204': { description: Removed }
  /transitions/{transitionId}/test-cases:
    parameters: [ { $ref: '#/components/parameters/TransitionId' } ]
    get:
      tags: [Assignments]
      summary: Test cases assigned to a transition (model step)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TestCase' } } } } }
  /transitions/{transitionId}/test-cases/{testCaseId}:
    parameters: [ { $ref: '#/components/parameters/TransitionId' }, { $ref: '#/components/parameters/TestCaseId' } ]
    put:
      tags: [Assignments]
      summary: Assign test case to transition (idempotent)
      responses:
        '204': { description: Assigned }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Assignments]
      summary: Remove assignment
      responses:
        '204': { description: Removed }
  /models/{modelId}/test-cases:
    parameters: [ { $ref: '#/components/parameters/ModelId' } ]
    get:
      tags: [Assignments]
      summary: Test cases assigned anywhere in the model, with their assignments
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TestCase' } } } } }

  /models/{modelId}/generate:
    parameters: [ { $ref: '#/components/parameters/ModelId' } ]
    post:
      tags: [Generation]
      summary: Generate test cases from the model. Deterministic for model, criterion and seed.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GenerationRequest' } } } }
      responses:
        '200': { description: Generated (saved only if save=true), content: { application/json: { schema: { $ref: '#/components/schemas/GenerationResult' } } } }
        '422': { $ref: '#/components/responses/Problem' }

  /models/{modelId}/coverage:
    parameters: [ { $ref: '#/components/parameters/ModelId' } ]
    get:
      tags: [Coverage]
      summary: Coverage of the model by assigned test cases
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Coverage' } } } }
  /models/{modelId}/simulate:
    parameters: [ { $ref: '#/components/parameters/ModelId' } ]
    post:
      tags: [Generation]
      summary: One simulation step on the graph the caller sends (the editor's current one). Nothing is stored.
      description: >-
        Without `stateId` the simulation starts at the initial state with every variable at its initial value.
        With `take`, that transition is taken from `stateId` with `env` (guard checked, action applied) and the
        result is the new state. The response always lists the outgoing transitions of the resulting state as
        enabled or blocked. Guards and actions are evaluated exactly as test generation evaluates them.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SimulationRequest' } } }
      responses:
        '200': { description: Step result, content: { application/json: { schema: { $ref: '#/components/schemas/SimulationStep' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /models/{modelId}/stale-tests:
    parameters: [ { $ref: '#/components/parameters/ModelId' } ]
    get:
      tags: [Coverage]
      summary: Generated test cases whose path no longer matches the current model, with reasons. Read-only.
      description: Only test cases with origin `generated` are checked. Only stale test cases are listed.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StaleTest' } } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /features/{featureId}/coverage:
    parameters: [ { $ref: '#/components/parameters/FeatureId' } ]
    get:
      tags: [Coverage]
      summary: Aggregated coverage of a feature
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Coverage' } } } }
  /components/{componentId}/coverage:
    parameters: [ { $ref: '#/components/parameters/ComponentId' } ]
    get:
      tags: [Coverage]
      summary: Aggregated coverage of a component
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Coverage' } } } }

  /projects/{projectId}/test-results:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    post:
      tags: [TestResults]
      summary: Import a JUnit XML or Cucumber JSON result file; each result is matched to a test case of the project
      description: >-
        The file is the request body (not multipart), at most 10 MB. A result is matched by the tag
        `@tm-<test case id>` (in a JUnit name, classname or `tmId` property, or a Cucumber tag), otherwise
        by exact test case name within the project. Re-importing the same file records nothing new.
        XML with a DOCTYPE is rejected.
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [junit, cucumber] } }
        - { name: dryRun, in: query, schema: { type: boolean, default: false }, description: Match and report without recording }
      requestBody:
        required: true
        content:
          application/xml: { schema: { type: string } }
          application/json: { schema: { type: string } }
      responses:
        '200': { description: Import report, content: { application/json: { schema: { $ref: '#/components/schemas/ImportReport' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/traceability:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    get:
      tags: [Traceability]
      summary: Trace backlog items to test cases, model elements and implementation links, with gaps
      parameters:
        - { name: componentId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: featureId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: gap, in: query, schema: { type: string, enum: [untraced, unimplemented, no-elements] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Traceability' } } } }
        '404': { $ref: '#/components/responses/Problem' }

  /projects/{projectId}/export:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    get:
      tags: [Export]
      summary: Export project data
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [json, csv, gherkin] } }
        - { name: featureId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: componentId, in: query, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: File download
          content:
            application/json: { schema: { type: object } }
            text/csv: { schema: { type: string } }
            text/plain: { schema: { type: string } }
  /projects/{projectId}/import:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    post:
      tags: [Export]
      summary: Import a JSON export into the project
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '201': { description: Imported, content: { application/json: { schema: { type: object, properties: { components: { type: integer }, features: { type: integer }, models: { type: integer }, testCases: { type: integer } } } } } }
        '422': { $ref: '#/components/responses/Problem' }

  /ai/proposals:
    post:
      tags: [AI]
      summary: Request AI proposals. Runs asynchronously; poll the job.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProposalRequest' } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '503': { $ref: '#/components/responses/Problem' }
  /jobs/{jobId}:
    parameters: [ { name: jobId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    get:
      tags: [AI]
      summary: Job status; result lists created proposal ids
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
  /projects/{projectId}/proposals:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    get:
      tags: [AI]
      summary: List proposals
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProposalStatus' } }
        - { name: featureId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: modelId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProposalPage' } } } }
  /proposals/{proposalId}:
    parameters: [ { $ref: '#/components/parameters/ProposalId' } ]
    get:
      tags: [AI]
      summary: Get proposal
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Proposal' } } } }
  /proposals/{proposalId}/accept:
    parameters: [ { $ref: '#/components/parameters/ProposalId' } ]
    post:
      tags: [AI]
      summary: Accept proposal, optionally with an edited payload. Creates the entity with origin=ai.
      requestBody:
        content: { application/json: { schema: { type: object, properties: { payload: { type: object } } } } }
      responses:
        '200': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Proposal' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /proposals/{proposalId}/reject:
    parameters: [ { $ref: '#/components/parameters/ProposalId' } ]
    post:
      tags: [AI]
      summary: Reject proposal
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } }
      responses:
        '200': { description: Rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Proposal' } } } }

  /settings/ai:
    get:
      tags: [Settings]
      summary: Get AI provider settings (secrets are never returned)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AiSettings' } } } }
    put:
      tags: [Settings]
      summary: Update AI provider settings
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AiSettingsInput' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/AiSettings' } } } }

  /projects/{projectId}/threat-model:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    get:
      tags: [ThreatModel]
      summary: Get the project's threat model
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ThreatModel' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [ThreatModel]
      summary: Create the project's threat model (at most one per project)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ThreatModelInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ThreatModel' } } } }
        '409': { $ref: '#/components/responses/Problem' }

  /threat-models/{threatModelId}:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' } ]
    get:
      tags: [ThreatModel]
      summary: Get threat model (scope, thresholds, layout)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ThreatModel' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [ThreatModel]
      summary: Replace scope fields and thresholds (layout is not touched)
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ThreatModelInput' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/ThreatModel' } } } }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [ThreatModel]
      summary: Delete threat model and everything in it
      responses:
        '204': { description: Deleted }

  /threat-models/{threatModelId}/layout:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' } ]
    put:
      tags: [ThreatModel]
      summary: Replace the diagram layout (opaque to the backend, max 256 KB)
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The threat model's `layoutVersion`
          schema: { type: integer, minimum: 0 }
      requestBody: { required: true, content: { application/json: { schema: { type: [object, 'null'] } } } }
      responses:
        '200':
          description: Saved
          content: { application/json: { schema: { type: object, required: [layoutVersion], properties: { layoutVersion: { type: integer } } } } }
        '412': { $ref: '#/components/responses/Problem' }

  /threat-models/{threatModelId}/summary:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' } ]
    get:
      tags: [ThreatModel]
      summary: Overview counts, matrix and gap lists
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ThreatModelSummary' } } } }

  # ---- Collections. Every list returns a plain array (threat models are small; no paging).
  # ---- Every item path returns 404 when the item does not belong to {threatModelId}.

  /threat-models/{threatModelId}/zones:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' } ]
    get:
      tags: [ThreatModel]
      summary: List exposure zones
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TmZone' } } } } }
    post:
      tags: [ThreatModel]
      summary: Create exposure zone
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TmZoneInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TmZone' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /threat-models/{threatModelId}/zones/{itemId}:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' }, { $ref: '#/components/parameters/ItemId' } ]
    get:
      tags: [ThreatModel]
      summary: Get zone
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TmZone' } } } }, '404': { $ref: '#/components/responses/Problem' } }
    put:
      tags: [ThreatModel]
      summary: Replace zone
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TmZoneInput' } } } }
      responses: { '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/TmZone' } } } }, '412': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
    delete:
      tags: [ThreatModel]
      summary: Delete zone (its components are left without a zone)
      responses: { '204': { description: Deleted } }

  /threat-models/{threatModelId}/components:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' } ]
    get:
      tags: [ThreatModel]
      summary: List architecture components (with computed warnings)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ArchComponent' } } } } }
    post:
      tags: [ThreatModel]
      summary: Create architecture component
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ArchComponentInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ArchComponent' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /threat-models/{threatModelId}/components/{itemId}:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' }, { $ref: '#/components/parameters/ItemId' } ]
    get:
      tags: [ThreatModel]
      summary: Get architecture component
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ArchComponent' } } } }, '404': { $ref: '#/components/responses/Problem' } }
    put:
      tags: [ThreatModel]
      summary: Replace architecture component (asset links replaced as a whole)
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ArchComponentInput' } } } }
      responses: { '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/ArchComponent' } } } }, '409': { $ref: '#/components/responses/Problem' }, '412': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
    delete:
      tags: [ThreatModel]
      summary: Delete architecture component and the flows that start or end at it
      responses: { '204': { description: Deleted } }

  /threat-models/{threatModelId}/assets:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' } ]
    get:
      tags: [ThreatModel]
      summary: List assets
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TmAsset' } } } } }
    post:
      tags: [ThreatModel]
      summary: Create asset
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TmAssetInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TmAsset' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /threat-models/{threatModelId}/assets/{itemId}:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' }, { $ref: '#/components/parameters/ItemId' } ]
    get:
      tags: [ThreatModel]
      summary: Get asset
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TmAsset' } } } }, '404': { $ref: '#/components/responses/Problem' } }
    put:
      tags: [ThreatModel]
      summary: Replace asset
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TmAssetInput' } } } }
      responses: { '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/TmAsset' } } } }, '409': { $ref: '#/components/responses/Problem' }, '412': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
    delete:
      tags: [ThreatModel]
      summary: Delete asset and its links
      responses: { '204': { description: Deleted } }

  /threat-models/{threatModelId}/flows:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' } ]
    get:
      tags: [ThreatModel]
      summary: List data flows (with computed crossing and warnings)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TmFlow' } } } } }
    post:
      tags: [ThreatModel]
      summary: Create data flow
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TmFlowInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TmFlow' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /threat-models/{threatModelId}/flows/{itemId}:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' }, { $ref: '#/components/parameters/ItemId' } ]
    get:
      tags: [ThreatModel]
      summary: Get data flow
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TmFlow' } } } }, '404': { $ref: '#/components/responses/Problem' } }
    put:
      tags: [ThreatModel]
      summary: Replace data flow (asset links replaced as a whole)
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TmFlowInput' } } } }
      responses: { '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/TmFlow' } } } }, '412': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
    delete:
      tags: [ThreatModel]
      summary: Delete data flow
      responses: { '204': { description: Deleted } }

  /threat-models/{threatModelId}/threats:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' } ]
    get:
      tags: [ThreatModel]
      summary: List threats (with computed level and flags)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Threat' } } } } }
    post:
      tags: [ThreatModel]
      summary: Create manual threat
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ThreatInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Threat' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /threat-models/{threatModelId}/threats/{itemId}:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' }, { $ref: '#/components/parameters/ItemId' } ]
    get:
      tags: [ThreatModel]
      summary: Get threat
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Threat' } } } }, '404': { $ref: '#/components/responses/Problem' } }
    put:
      tags: [ThreatModel]
      summary: Replace threat (targets, assets and controls replaced as a whole)
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ThreatInput' } } } }
      responses: { '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Threat' } } } }, '412': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
    delete:
      tags: [ThreatModel]
      summary: Delete threat (a rule-created threat's rule key is kept, so the rule does not suggest it again)
      responses: { '204': { description: Deleted } }
  /threat-models/{threatModelId}/threats/suggest:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' } ]
    post:
      tags: [ThreatModel]
      summary: Apply the STRIDE rules and create candidate threats for new matches
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/SuggestThreatsResult' } } } }
  /threat-models/{threatModelId}/threats/bulk-status:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' } ]
    post:
      tags: [ThreatModel]
      summary: Set the status of several threats at once (confirm or dismiss)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ThreatBulkStatus' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Threat' } } } } }
        '422': { $ref: '#/components/responses/Problem' }

  /threat-models/{threatModelId}/controls:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' } ]
    get:
      tags: [ThreatModel]
      summary: List security controls
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SecurityControl' } } } } }
    post:
      tags: [ThreatModel]
      summary: Create security control
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityControlInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityControl' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /threat-models/{threatModelId}/controls/{itemId}:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' }, { $ref: '#/components/parameters/ItemId' } ]
    get:
      tags: [ThreatModel]
      summary: Get security control
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityControl' } } } }, '404': { $ref: '#/components/responses/Problem' } }
    put:
      tags: [ThreatModel]
      summary: Replace security control (threat and component links replaced as a whole)
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityControlInput' } } } }
      responses: { '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityControl' } } } }, '412': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
    delete:
      tags: [ThreatModel]
      summary: Delete security control and its links
      responses: { '204': { description: Deleted } }

  /threat-models/{threatModelId}/security-tests:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' } ]
    get:
      tags: [ThreatModel]
      summary: List security tests (with staleness and latest result)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SecurityTest' } } } } }
    post:
      tags: [ThreatModel]
      summary: Create manual security test
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityTestInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityTest' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /threat-models/{threatModelId}/security-tests/{itemId}:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' }, { $ref: '#/components/parameters/ItemId' } ]
    get:
      tags: [ThreatModel]
      summary: Get security test
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityTest' } } } }, '404': { $ref: '#/components/responses/Problem' } }
    put:
      tags: [ThreatModel]
      summary: Replace security test including steps and links
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityTestInput' } } } }
      responses: { '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityTest' } } } }, '412': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
    delete:
      tags: [ThreatModel]
      summary: Delete security test and its results
      responses: { '204': { description: Deleted } }
  /threat-models/{threatModelId}/security-tests/generate:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' } ]
    post:
      tags: [ThreatModel]
      summary: Generate draft security tests from open/accepted threats
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { threatIds: { type: array, items: { $ref: '#/components/schemas/Id' }, description: Omit for all open and accepted threats } } } } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/GenerateSecurityTestsResult' } } } }
  /threat-models/{threatModelId}/security-tests/bulk-status:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' } ]
    post:
      tags: [ThreatModel]
      summary: Set the status of several security tests at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, status]
              properties:
                ids: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Id' } }
                status: { $ref: '#/components/schemas/SecurityTestStatus' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SecurityTest' } } } } }
  /threat-models/{threatModelId}/security-tests/{itemId}/results:
    parameters: [ { $ref: '#/components/parameters/ThreatModelId' }, { $ref: '#/components/parameters/ItemId' } ]
    get:
      tags: [ThreatModel]
      summary: Result history of a security test, newest first
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SecurityTestResult' } } } } }
    post:
      tags: [ThreatModel]
      summary: Record a manual result (test must be ready)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityTestResultInput' } } } }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityTestResult' } } } }
        '422': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    ProjectId: { name: projectId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ComponentId: { name: componentId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    FeatureId: { name: featureId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ModelId: { name: modelId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    StateId: { name: stateId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    TransitionId: { name: transitionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    TestCaseId: { name: testCaseId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ProposalId: { name: proposalId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Entity `version` for optimistic concurrency
      schema: { type: integer, minimum: 1 }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Cascade: { name: cascade, in: query, schema: { type: boolean, default: false } }
    ThreatModelId: { name: threatModelId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ItemId: { name: itemId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }

  responses:
    Problem:
      description: Error (RFC 7807)
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }

  schemas:
    Id: { type: string, format: uuid }
    Timestamp: { type: string, format: date-time }
    Origin: { type: string, enum: [manual, generated, ai] }
    TestCaseStatus: { type: string, enum: [draft, approved, deprecated] }
    ProposalStatus: { type: string, enum: [pending, accepted, rejected] }

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items: { type: object, properties: { field: { type: string }, message: { type: string } } }
    Health:
      type: object
      required: [status, version]
      properties: { status: { type: string, enum: [ok] }, version: { type: string } }

    Audit:
      type: object
      required: [id, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        version: { type: integer, minimum: 1 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }

    ProjectInput:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 1, maxLength: 200 }, description: { type: string } }
    Project:
      allOf: [ { $ref: '#/components/schemas/Audit' }, { $ref: '#/components/schemas/ProjectInput' } ]
    ProjectPage:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Project' } }, nextCursor: { type: [string, 'null'] } }

    ComponentInput:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 1, maxLength: 200 }, description: { type: string } }
    Component:
      allOf:
        - { $ref: '#/components/schemas/Audit' }
        - { $ref: '#/components/schemas/ComponentInput' }
        - { type: object, required: [projectId], properties: { projectId: { $ref: '#/components/schemas/Id' } } }
    ComponentPage:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Component' } }, nextCursor: { type: [string, 'null'] } }

    FeatureInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        scenarioDescription: { type: string, description: Free-text (markdown) description of the scenarios this feature's models represent }
        tags: { type: array, items: { type: string } }
    Feature:
      allOf:
        - { $ref: '#/components/schemas/Audit' }
        - { $ref: '#/components/schemas/FeatureInput' }
        - { type: object, required: [componentId], properties: { componentId: { $ref: '#/components/schemas/Id' } } }
    FeaturePage:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Feature' } }, nextCursor: { type: [string, 'null'] } }

    ModelStatus: { type: string, enum: [draft, ready] }
    ModelMetaInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        status: { $ref: '#/components/schemas/ModelStatus' }
    StateKind: { type: string, enum: [initial, normal, final] }
    Position:
      type: object
      required: [x, y]
      properties: { x: { type: number }, y: { type: number } }
    StateInput:
      type: object
      required: [name, kind]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1 }
        description: { type: string }
        kind: { $ref: '#/components/schemas/StateKind' }
        position: { $ref: '#/components/schemas/Position' }
    State:
      allOf:
        - { $ref: '#/components/schemas/StateInput' }
        - type: object
          required: [id, modelId, testCaseCount]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            modelId: { $ref: '#/components/schemas/Id' }
            testCaseCount: { type: integer, readOnly: true }
    TransitionInput:
      type: object
      required: [from, to, event]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        from: { $ref: '#/components/schemas/Id' }
        to: { $ref: '#/components/schemas/Id' }
        event: { type: string, minLength: 1 }
        guard: { type: string }
        action: { type: string }
        expected: { type: string }
    Transition:
      allOf:
        - { $ref: '#/components/schemas/TransitionInput' }
        - type: object
          required: [id, modelId, testCaseCount]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            modelId: { $ref: '#/components/schemas/Id' }
            testCaseCount: { type: integer, readOnly: true }
    Variable:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [boolean, integer, string] }
        initial: {}
    ModelInput:
      allOf:
        - { $ref: '#/components/schemas/ModelMetaInput' }
        - type: object
          required: [name]
          properties:
            variables: { type: array, items: { $ref: '#/components/schemas/Variable' } }
            states: { type: array, items: { $ref: '#/components/schemas/StateInput' } }
            transitions: { type: array, items: { $ref: '#/components/schemas/TransitionInput' } }
            layout: { $ref: '#/components/schemas/ModelLayout' }
    ModelLayout:
      type: [object, 'null']
      additionalProperties: true
      description: >-
        Editor presentation (shapes, colours, sizes, groups, transition routing, display numbers).
        Owned by the editor and versioned by its own `v` key; the backend stores and returns it without
        interpreting it, except that element ids inside it are remapped when a model is duplicated or
        imported. At most 256 KB. On save, an absent `layout` keeps the stored one and `null` clears it.
        Ignored by validation, generation and coverage.
    ModelSummary:
      allOf:
        - { $ref: '#/components/schemas/Audit' }
        - { $ref: '#/components/schemas/ModelMetaInput' }
        - type: object
          required: [featureId, stateCount, transitionCount, testCaseCount]
          properties:
            featureId: { $ref: '#/components/schemas/Id' }
            stateCount: { type: integer }
            transitionCount: { type: integer }
            testCaseCount: { type: integer }
    Model:
      allOf:
        - { $ref: '#/components/schemas/ModelSummary' }
        - type: object
          properties:
            variables: { type: array, items: { $ref: '#/components/schemas/Variable' } }
            states: { type: array, items: { $ref: '#/components/schemas/State' } }
            transitions: { type: array, items: { $ref: '#/components/schemas/Transition' } }
            layout: { $ref: '#/components/schemas/ModelLayout' }
    ModelVersion:
      type: object
      required: [version, createdAt]
      properties: { version: { type: integer }, createdAt: { $ref: '#/components/schemas/Timestamp' }, summary: { type: string } }
    ValidationIssue:
      type: object
      required: [severity, code, message]
      properties:
        severity: { type: string, enum: [error, warning] }
        code: { type: string, examples: [NO_INITIAL_STATE, MULTIPLE_INITIAL_STATES, UNREACHABLE_STATE, DEAD_END, BAD_GUARD] }
        message: { type: string }
        stateId: { $ref: '#/components/schemas/Id' }
        transitionId: { $ref: '#/components/schemas/Id' }

    TestStepInput:
      type: object
      required: [action, expected]
      properties:
        action: { type: string }
        expected: { type: string }
    TestStep:
      allOf:
        - { $ref: '#/components/schemas/TestStepInput' }
        - type: object
          required: [order]
          properties:
            order: { type: integer, minimum: 1 }
    TestCaseInput:
      type: object
      required: [name, steps]
      properties:
        name: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string }
        preconditions: { type: string }
        priority: { type: string, enum: [low, medium, high] }
        status: { $ref: '#/components/schemas/TestCaseStatus' }
        tags: { type: array, items: { type: string } }
        implementationUrl: { type: string, format: uri, maxLength: 2048, pattern: '^https?://', description: Optional http(s) link to the implementation }
        backlogUrl: { type: string, format: uri, maxLength: 2048, pattern: '^https?://', description: Optional http(s) link to the backlog item (the requirement) }
        steps: { type: array, items: { $ref: '#/components/schemas/TestStepInput' } }
        assignments: { type: array, items: { $ref: '#/components/schemas/AssignmentInput' } }
    TestCase:
      allOf:
        - { $ref: '#/components/schemas/Audit' }
        - type: object
          required: [featureId, name, steps, origin, assignments]
          properties:
            featureId: { $ref: '#/components/schemas/Id' }
            name: { type: string }
            description: { type: string }
            preconditions: { type: string }
            priority: { type: string, enum: [low, medium, high] }
            status: { $ref: '#/components/schemas/TestCaseStatus' }
            tags: { type: array, items: { type: string } }
            implementationUrl: { type: string, format: uri, maxLength: 2048, pattern: '^https?://', description: Optional http(s) link to the implementation }
            backlogUrl: { type: string, format: uri, maxLength: 2048, pattern: '^https?://', description: Optional http(s) link to the backlog item (the requirement) }
            origin: { $ref: '#/components/schemas/Origin' }
            generatedFromModelId: { $ref: '#/components/schemas/Id' }
            lastResult: { allOf: [ { $ref: '#/components/schemas/TestResult' } ], readOnly: true, description: Most recent imported result by execution time }
            steps: { type: array, items: { $ref: '#/components/schemas/TestStep' } }
            assignments: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
    Traceability:
      type: object
      required: [items, untraced, summary]
      properties:
        items:
          type: array
          description: Backlog items, grouped by normalised backlog URL
          items: { $ref: '#/components/schemas/TraceabilityItem' }
        untraced:
          type: array
          description: Test cases without a backlog link
          items: { $ref: '#/components/schemas/TraceabilityTestCase' }
        summary:
          type: object
          required: [backlogItems, testCases, untraced, unimplemented, noElements]
          properties:
            backlogItems: { type: integer, minimum: 0 }
            testCases: { type: integer, minimum: 0 }
            untraced: { type: integer, minimum: 0 }
            unimplemented: { type: integer, minimum: 0, description: Test cases with a backlog link but no implementation link }
            noElements: { type: integer, minimum: 0, description: Backlog items whose test cases are assigned to no state or transition }
    TraceabilityItem:
      type: object
      required: [backlogUrl, testCases]
      properties:
        backlogUrl: { type: string, format: uri }
        testCases: { type: array, items: { $ref: '#/components/schemas/TraceabilityTestCase' } }
    TraceabilityTestCase:
      type: object
      required: [id, name, featureId, componentId, elements]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        featureId: { $ref: '#/components/schemas/Id' }
        componentId: { $ref: '#/components/schemas/Id' }
        implementationUrl: { type: string, format: uri }
        lastResult: { $ref: '#/components/schemas/TestResult' }
        elements:
          type: array
          description: Exactly one of stateId or transitionId per element
          items:
            type: object
            required: [modelId]
            properties:
              modelId: { $ref: '#/components/schemas/Id' }
              stateId: { $ref: '#/components/schemas/Id' }
              transitionId: { $ref: '#/components/schemas/Id' }
    TestCasePage:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/TestCase' } }, nextCursor: { type: [string, 'null'] } }

    AssignmentInput:
      type: object
      required: [modelId]
      description: Exactly one of stateId or transitionId. A test case may be assigned to many states/transitions, also across models of its feature.
      properties:
        modelId: { $ref: '#/components/schemas/Id' }
        stateId: { $ref: '#/components/schemas/Id' }
        transitionId: { $ref: '#/components/schemas/Id' }
        stepOrder: { type: integer, minimum: 1, description: Optional test step this assignment refers to }
    Assignment:
      allOf:
        - { $ref: '#/components/schemas/AssignmentInput' }
        - type: object
          required: [testCaseId]
          properties: { testCaseId: { $ref: '#/components/schemas/Id' } }

    CoverageCriterion: { type: string, enum: [state, transition, transition-pair, bounded-paths] }
    GenerationRequest:
      type: object
      required: [criterion]
      properties:
        criterion: { $ref: '#/components/schemas/CoverageCriterion' }
        seed: { type: integer }
        maxPathLength: { type: integer, minimum: 1, description: Required for bounded-paths }
        save: { type: boolean, default: false, description: Persist generated test cases and assign them to the model }
    GenerationResult:
      type: object
      required: [testCases, coverage]
      properties:
        seed: { type: integer }
        testCases: { type: array, items: { $ref: '#/components/schemas/TestCase' } }
        coverage: { $ref: '#/components/schemas/Coverage' }
        skippedPaths: { type: array, items: { type: object, properties: { transitionIds: { type: array, items: { $ref: '#/components/schemas/Id' } }, reason: { type: string } } } }
    Coverage:
      type: object
      required: [states, transitions]
      properties:
        states: { $ref: '#/components/schemas/CoverageCount' }
        transitions: { $ref: '#/components/schemas/CoverageCount' }
        uncoveredStateIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
        uncoveredTransitionIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
    TestResult:
      type: object
      required: [id, testCaseId, runId, status, executedAt, source]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        testCaseId: { $ref: '#/components/schemas/Id' }
        runId: { type: string }
        status: { type: string, enum: [passed, failed, skipped, error] }
        durationMs: { type: integer, minimum: 0 }
        message: { type: string }
        executedAt: { type: string, format: date-time }
        source: { type: string, description: Format and file the result came from }
    ImportReport:
      type: object
      required: [dryRun, total, matched, recorded, duplicates, unmatched, ambiguous]
      properties:
        dryRun: { type: boolean }
        total: { type: integer, description: Results in the file }
        matched: { type: integer }
        recorded: { type: integer, description: New results stored (0 on a dry run) }
        duplicates: { type: integer, description: Matched results already stored for the same run }
        unmatched: { type: array, items: { type: string }, description: Names of results matching no test case }
        ambiguous: { type: array, items: { type: string }, description: Names matching several test cases }
    SimulationRequest:
      type: object
      required: [graph]
      properties:
        graph: { $ref: '#/components/schemas/ModelInput' }
        stateId: { $ref: '#/components/schemas/Id' }
        env:
          type: object
          additionalProperties: true
          description: Variable values at `stateId`, as returned by the previous step
        take: { $ref: '#/components/schemas/Id' }
    SimulationStep:
      type: object
      required: [stateId, env, final, transitions]
      properties:
        stateId: { $ref: '#/components/schemas/Id' }
        env: { type: object, additionalProperties: true }
        final: { type: boolean, description: The state is a final state }
        transitions:
          type: array
          items:
            type: object
            required: [transitionId, enabled]
            properties:
              transitionId: { $ref: '#/components/schemas/Id' }
              enabled: { type: boolean }
              reason: { type: string, description: Why it is blocked (the false guard or the evaluation error) }
    StaleTest:
      type: object
      required: [testCaseId, reasons]
      properties:
        testCaseId: { $ref: '#/components/schemas/Id' }
        reasons: { type: array, minItems: 1, items: { $ref: '#/components/schemas/StaleReason' } }
    StaleReason:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [STEP_UNASSIGNED, STEPS_DISCONNECTED, NOT_FROM_INITIAL, GUARD_UNSATISFIABLE] }
        stepOrder: { type: integer, minimum: 1, description: '1-based step the reason refers to, when it is one step' }
        message: { type: string }
    CoverageCount:
      type: object
      required: [covered, total]
      properties:
        covered: { type: integer }
        total: { type: integer }
        passing: { type: integer, description: Covered elements whose covering test cases all have a latest result of passed }

    ProjectTree:
      type: object
      properties:
        components:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Id' }
              name: { type: string }
              features:
                type: array
                items:
                  type: object
                  properties:
                    id: { $ref: '#/components/schemas/Id' }
                    name: { type: string }
                    models: { type: array, items: { type: object, properties: { id: { $ref: '#/components/schemas/Id' }, name: { type: string }, status: { $ref: '#/components/schemas/ModelStatus' } } } }
    SearchHit:
      type: object
      required: [type, id, name]
      properties:
        type: { type: string, enum: [component, feature, model, testCase] }
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        snippet: { type: string }

    ProposalKind: { type: string, enum: [model, states-and-transitions, test-cases, feature-description] }
    ProposalRequest:
      type: object
      required: [kind, featureId]
      properties:
        kind: { $ref: '#/components/schemas/ProposalKind' }
        featureId: { $ref: '#/components/schemas/Id' }
        modelId: { $ref: '#/components/schemas/Id' }
        prompt: { type: string, maxLength: 8000, description: Free-text instruction from the user }
        count: { type: integer, minimum: 1, maximum: 20 }
        previewContext: { type: boolean, default: false, description: Return the context that would be sent instead of calling the model }
    Proposal:
      type: object
      required: [id, projectId, kind, status, payload, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        projectId: { $ref: '#/components/schemas/Id' }
        featureId: { $ref: '#/components/schemas/Id' }
        modelId: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/ProposalKind' }
        status: { $ref: '#/components/schemas/ProposalStatus' }
        payload: { type: object, description: Shape matches the target entity input (ModelInput, StateInput/TransitionInput lists, TestCaseInput list) }
        rationale: { type: string }
        source: { type: string, description: Model id of the LLM }
        resultingEntityId: { $ref: '#/components/schemas/Id' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    ProposalPage:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Proposal' } }, nextCursor: { type: [string, 'null'] } }
    Job:
      type: object
      required: [id, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        proposalIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
        error: { $ref: '#/components/schemas/Problem' }

    AiSettings:
      type: object
      properties:
        provider: { type: string, enum: [openai-compatible, anthropic, local, none] }
        baseUrl: { type: string, format: uri }
        model: { type: string }
        secretConfigured: { type: boolean }
        maxTokensPerRequest: { type: integer }
    AiSettingsInput:
      allOf:
        - { $ref: '#/components/schemas/AiSettings' }
        - type: object
          properties: { apiKey: { type: string, writeOnly: true } }

    # ---- Enums
    ArchComponentType:
      type: string
      enum: [web-frontend, mobile-app, desktop-client, browser-extension,
             api-gateway, api, message-broker, webhook, external-connector,
             service, worker, scheduler, serverless-function,
             relational-database, object-storage, cache, search-index, file-store, backup,
             identity-provider, authorization-service, secrets-manager, key-management, audit-service,
             cloud-service, container-platform, cicd-pipeline, third-party-saas, library,
             human-user, external-system]
    ArchLayer: { type: string, enum: [client, integration, logic, data, identity-security, platform, external] }
    Criticality: { type: string, enum: [low, medium, high, critical] }
    ZoneKind: { type: string, enum: [internet, partner, dmz, internal, restricted-data, management, identity, cicd, third-party, other] }
    TrustLevel: { type: integer, minimum: 0, maximum: 4 }
    AssetCategory: { type: string, enum: [business-data, identity-secrets, software-code, infrastructure, security-asset, operational-asset, business-capability] }
    CiaLevel: { type: string, enum: [low, medium, high] }
    FlowRelationship: { type: string, enum: [calls, sends-data, reads-writes, authenticates-through, trusts, depends-on, runs-on, publishes-subscribes, replicates-backs-up, deploys] }
    TriState: { type: string, enum: ['yes', 'no', unknown] }
    StrideCategory: { type: string, enum: [spoofing, tampering, repudiation, information-disclosure, denial-of-service, elevation-of-privilege] }
    ThreatStatus: { type: string, enum: [candidate, open, mitigated, accepted, dismissed] }
    ThreatOrigin: { type: string, enum: [manual, rule] }
    RiskLevel: { type: string, enum: [low, moderate, high, critical] }
    RiskTreatment: { type: string, enum: [undecided, mitigate, avoid, transfer, accept] }
    ThreatFlag: { type: string, enum: [no-control, planned-controls-only, unsupported-reduction, overdue, failing-test] }
    ControlType: { type: string, enum: [preventive, detective, corrective, compensating] }
    ControlCategory: { type: string, enum: [identity-access, data-protection, application-network, detection-response, secure-development] }
    ControlStatus: { type: string, enum: [planned, implemented, verified] }
    SecurityTestType: { type: string, enum: [negative-authorization, authentication, input-validation, transport-security, configuration-review, resilience, logging-audit, other] }
    SecurityTestStatus: { type: string, enum: [draft, ready, obsolete] }
    SecurityTestOrigin: { type: string, enum: [manual, generated] }
    SecurityTestOutcome: { type: string, enum: [passed, failed, not-run] }

    Warning:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: 'e.g. NO_ZONE, NO_OWNER, INTERNET_FACING_NO_FLOW, CROSSING_AUTH_UNDOCUMENTED, CROSSING_ENCRYPTION_UNDOCUMENTED, ASSET_UNLINKED' }
        message: { type: string }

    # ---- Threat model
    RiskThreshold:
      type: object
      required: [level, min, max]
      properties:
        level: { $ref: '#/components/schemas/RiskLevel' }
        min: { type: integer, minimum: 1, maximum: 25 }
        max: { type: integer, minimum: 1, maximum: 25 }
    ThreatModelInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        scope: { type: string }
        objectives: { type: string }
        assumptions: { type: string }
        exclusions: { type: string }
        thresholds:
          type: array
          description: Must cover 1–25 contiguously without overlap; omitted on create means the defaults
          items: { $ref: '#/components/schemas/RiskThreshold' }
    ThreatModel:
      allOf:
        - { $ref: '#/components/schemas/Audit' }
        - { $ref: '#/components/schemas/ThreatModelInput' }
        - type: object
          required: [projectId, thresholds, layoutVersion]
          properties:
            projectId: { $ref: '#/components/schemas/Id' }
            layout: { type: [object, 'null'], description: 'Diagram layout, opaque to the backend' }
            layoutVersion: { type: integer, minimum: 0 }

    MatrixCell:
      type: object
      required: [likelihood, impact, count]
      properties:
        likelihood: { type: integer, minimum: 1, maximum: 5 }
        impact: { type: integer, minimum: 1, maximum: 5 }
        count: { type: integer }
    RefLabel:
      type: object
      required: [id, label]
      properties: { id: { $ref: '#/components/schemas/Id' }, label: { type: string, description: 'Display id and title, e.g. "THR-3 Unauthorized access"' } }
    ThreatModelSummary:
      type: object
      required: [components, assets, flows, crossings, threatsByStatus, openByLevel, inherentMatrix, currentMatrix, controlsVerifiedRatio, threatsWithoutControl, controlsWithoutTest, warningCount, overdueCount]
      properties:
        components: { type: integer }
        assets: { type: integer }
        flows: { type: integer }
        crossings: { type: integer }
        threatsByStatus: { type: object, additionalProperties: { type: integer } }
        openByLevel: { type: object, additionalProperties: { type: integer }, description: 'Keys are RiskLevel values plus "not-assessed"' }
        inherentMatrix: { type: array, items: { $ref: '#/components/schemas/MatrixCell' } }
        currentMatrix: { type: array, items: { $ref: '#/components/schemas/MatrixCell' } }
        controlsVerifiedRatio: { type: [number, 'null'], minimum: 0, maximum: 1 }
        threatsWithoutControl: { type: array, items: { $ref: '#/components/schemas/RefLabel' } }
        controlsWithoutTest: { type: array, items: { $ref: '#/components/schemas/RefLabel' } }
        warningCount: { type: integer }
        overdueCount: { type: integer }

    # ---- Architecture
    TmZoneInput:
      type: object
      required: [name, kind, trustLevel]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        kind: { $ref: '#/components/schemas/ZoneKind' }
        trustLevel: { $ref: '#/components/schemas/TrustLevel' }
    TmZone:
      allOf:
        - { $ref: '#/components/schemas/Audit' }
        - { $ref: '#/components/schemas/TmZoneInput' }

    ArchComponentInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        type: { $ref: '#/components/schemas/ArchComponentType' }
        owner: { type: string, maxLength: 200 }
        technology: { type: string, maxLength: 200 }
        criticality: { $ref: '#/components/schemas/Criticality' }
        internetFacing: { type: boolean, default: false }
        zoneId: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        linkedComponentId: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: An existing Component of the same project }
        linkedFeatureId: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: An existing Feature of the same project }
        assetIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
    ArchComponent:
      allOf:
        - { $ref: '#/components/schemas/Audit' }
        - { $ref: '#/components/schemas/ArchComponentInput' }
        - type: object
          required: [layer, warnings]
          properties:
            layer: { $ref: '#/components/schemas/ArchLayer' }
            warnings: { type: array, items: { $ref: '#/components/schemas/Warning' } }

    TmAssetInput:
      type: object
      required: [name, category]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        category: { $ref: '#/components/schemas/AssetCategory' }
        owner: { type: string, maxLength: 200 }
        confidentiality: { $ref: '#/components/schemas/CiaLevel' }
        integrity: { $ref: '#/components/schemas/CiaLevel' }
        availability: { $ref: '#/components/schemas/CiaLevel' }
        personalData: { type: boolean, default: false }
    TmAsset:
      allOf:
        - { $ref: '#/components/schemas/Audit' }
        - { $ref: '#/components/schemas/TmAssetInput' }
        - type: object
          required: [componentIds, flowIds, warnings]
          properties:
            componentIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
            flowIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
            warnings: { type: array, items: { $ref: '#/components/schemas/Warning' } }

    TmFlowInput:
      type: object
      required: [sourceId, targetId, relationship]
      properties:
        sourceId: { $ref: '#/components/schemas/Id' }
        targetId: { $ref: '#/components/schemas/Id' }
        relationship: { $ref: '#/components/schemas/FlowRelationship' }
        label: { type: string, maxLength: 200 }
        protocol: { type: string, maxLength: 100 }
        bidirectional: { type: boolean, default: false }
        authentication: { type: string, maxLength: 200, description: '"none", "unknown" (default) or a free-text method such as "mTLS"' }
        encrypted: { $ref: '#/components/schemas/TriState' }
        assetIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
    Crossing:
      type: object
      required: [crosses]
      properties:
        crosses: { type: boolean }
        direction: { type: [string, 'null'], enum: [into-more-trusted, into-less-trusted, null] }
        fromTrust: { type: [integer, 'null'] }
        toTrust: { type: [integer, 'null'] }
    TmFlow:
      allOf:
        - { $ref: '#/components/schemas/Audit' }
        - { $ref: '#/components/schemas/TmFlowInput' }
        - type: object
          required: [crossing, warnings]
          properties:
            crossing: { $ref: '#/components/schemas/Crossing' }
            warnings: { type: array, items: { $ref: '#/components/schemas/Warning' } }

    # ---- Threats and risk
    Rating:
      type: object
      required: [likelihood, impact]
      properties:
        likelihood: { type: integer, minimum: 1, maximum: 5 }
        impact: { type: integer, minimum: 1, maximum: 5 }
    ThreatTarget:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [component, flow] }
        id: { $ref: '#/components/schemas/Id' }
    ThreatInput:
      type: object
      required: [title, category, targets]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        category: { $ref: '#/components/schemas/StrideCategory' }
        scenario: { type: string }
        attackerObjective: { type: string }
        preconditions: { type: string }
        consequences: { type: string }
        targets: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ThreatTarget' } }
        assetIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
        controlIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
        status: { $ref: '#/components/schemas/ThreatStatus' }
        dismissReason: { type: [string, 'null'], description: Required when status is dismissed }
        inherent: { oneOf: [ { $ref: '#/components/schemas/Rating' }, { type: 'null' } ] }
        current: { oneOf: [ { $ref: '#/components/schemas/Rating' }, { type: 'null' } ] }
        treatment: { $ref: '#/components/schemas/RiskTreatment' }
        riskOwner: { type: string, maxLength: 200 }
        dueDate: { type: [string, 'null'], format: date }
        acceptanceRationale: { type: [string, 'null'], description: Required when treatment is accept }
        acceptedBy: { type: [string, 'null'], description: Required when treatment is accept }
    RuleExplanation:
      type: object
      required: [ruleId, ruleVersion, ruleName, facts, missing, recommendations]
      properties:
        ruleId: { type: string }
        ruleVersion: { type: integer }
        ruleName: { type: string }
        facts: { type: array, items: { type: string } }
        missing: { type: array, items: { type: string }, description: Information that would confirm or dismiss the candidate }
        recommendations: { type: array, items: { type: string }, description: Recommended controls }
    Threat:
      allOf:
        - { $ref: '#/components/schemas/Audit' }
        - { $ref: '#/components/schemas/ThreatInput' }
        - type: object
          required: [displayId, origin, inherentScore, currentScore, inherentLevel, currentLevel, flags]
          properties:
            displayId: { type: string, example: THR-1 }
            origin: { $ref: '#/components/schemas/ThreatOrigin' }
            explanation: { oneOf: [ { $ref: '#/components/schemas/RuleExplanation' }, { type: 'null' } ] }
            inherentScore: { type: [integer, 'null'] }
            currentScore: { type: [integer, 'null'] }
            inherentLevel: { oneOf: [ { $ref: '#/components/schemas/RiskLevel' }, { type: 'null' } ] }
            currentLevel: { oneOf: [ { $ref: '#/components/schemas/RiskLevel' }, { type: 'null' } ] }
            flags: { type: array, items: { $ref: '#/components/schemas/ThreatFlag' } }
    SuggestThreatsResult:
      type: object
      required: [rulesetVersion, created, skipped]
      properties:
        rulesetVersion: { type: integer }
        created: { type: array, items: { $ref: '#/components/schemas/Threat' } }
        skipped: { type: integer, description: Matches that already have a threat (incl. dismissed or deleted) }
    ThreatBulkStatus:
      type: object
      required: [ids, status]
      properties:
        ids: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Id' } }
        status: { type: string, enum: [open, dismissed] }
        reason: { type: string, description: Required for dismissed }

    # ---- Controls
    SecurityControlInput:
      type: object
      required: [name, type, category]
      properties:
        name: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string }
        type: { $ref: '#/components/schemas/ControlType' }
        category: { $ref: '#/components/schemas/ControlCategory' }
        status: { $ref: '#/components/schemas/ControlStatus' }
        owner: { type: string, maxLength: 200 }
        acceptanceCriteria: { type: string }
        componentIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
        threatIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
    SecurityControl:
      allOf:
        - { $ref: '#/components/schemas/Audit' }
        - { $ref: '#/components/schemas/SecurityControlInput' }
        - type: object
          required: [displayId, securityTestIds]
          properties:
            displayId: { type: string, example: CTL-1 }
            verifiedAt: { type: [string, 'null'], format: date-time, description: Set when status becomes verified }
            securityTestIds: { type: array, items: { $ref: '#/components/schemas/Id' } }

    # ---- Security tests
    SecurityTestStep:
      type: object
      required: [action, expected]
      properties: { action: { type: string, minLength: 1 }, expected: { type: string } }
    SecurityTestFields:
      type: object
      required: [title, type]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        objective: { type: string }
        preconditions: { type: array, items: { type: string } }
        steps: { type: array, items: { $ref: '#/components/schemas/SecurityTestStep' } }
        type: { $ref: '#/components/schemas/SecurityTestType' }
        status: { $ref: '#/components/schemas/SecurityTestStatus' }
        controlIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
    SecurityTestInput:
      allOf:
        - { $ref: '#/components/schemas/SecurityTestFields' }
        - type: object
          required: [threatIds]
          properties:
            threatIds: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Id' } }
    SecurityTestResultInput:
      type: object
      required: [outcome]
      properties:
        outcome: { $ref: '#/components/schemas/SecurityTestOutcome' }
        note: { type: string, maxLength: 2000 }
        executedAt: { $ref: '#/components/schemas/Timestamp', description: Defaults to now }
    SecurityTestResult:
      allOf:
        - { $ref: '#/components/schemas/SecurityTestResultInput' }
        - type: object
          required: [id, securityTestId, executedAt]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            securityTestId: { $ref: '#/components/schemas/Id' }
    SecurityTest:
      allOf:
        - { $ref: '#/components/schemas/Audit' }
        - { $ref: '#/components/schemas/SecurityTestFields' }
        - type: object
          required: [displayId, origin, threatIds]
          properties:
            threatIds: { type: array, items: { $ref: '#/components/schemas/Id' }, description: Empty when all its threats were deleted (the test is then stale) }
            displayId: { type: string, example: SEC-1 }
            origin: { $ref: '#/components/schemas/SecurityTestOrigin' }
            templateId: { type: [string, 'null'] }
            templateVersion: { type: [integer, 'null'] }
            stale: { type: [string, 'null'], description: 'Reason the generated test is stale, e.g. "threat dismissed", "no threat", "control unlinked: CTL-2"' }
            lastResult: { oneOf: [ { $ref: '#/components/schemas/SecurityTestResult' }, { type: 'null' } ] }
    GenerateSecurityTestsResult:
      type: object
      required: [created, skipped]
      properties:
        created: { type: array, items: { $ref: '#/components/schemas/SecurityTest' } }
        skipped: { type: integer, description: Template/threat/control combinations that already have a non-obsolete test }
