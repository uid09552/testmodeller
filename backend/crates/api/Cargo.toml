[package]
name = "tm-api"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "testmodeller"
path = "src/main.rs"

[dependencies]
tm-domain = { path = "../domain" }
tm-generation = { path = "../generation" }
tm-storage = { path = "../storage" }
tm-ai = { path = "../ai" }
reqwest.workspace = true
jsonwebtoken.workspace = true
chacha20poly1305.workspace = true
base64.workspace = true
sha2.workspace = true
tm-mcp = { path = "../mcp" }
serde_urlencoded = "0.7"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
axum.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap.workspace = true
thiserror.workspace = true
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }
quick-xml.workspace = true
async-trait.workspace = true
tower.workspace = true
http-body-util.workspace = true

[features]
# `--dev-mode`: a throwaway PostgreSQL in Docker. Release images build without
# it (`--no-default-features`), which leaves out the Docker client crates.
default = ["dev-mode"]
dev-mode = ["dep:testcontainers", "dep:testcontainers-modules"]

[dev-dependencies]
sqlx.workspace = true
testcontainers.workspace = true
testcontainers-modules.workspace = true
