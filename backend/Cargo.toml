[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/generation",
  "crates/storage",
  "crates/ai",
  "crates/api",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
