<ix-application-header name="TestModeller">
  <tm-breadcrumb slot="secondary" />

  <ix-icon-button
    variant="subtle-tertiary"
    [icon]="icons.search"
    aria-label="Global search (⌘K)"
    title="Search (⌘K)" />

  <ix-avatar
    slot="ix-application-header-avatar"
    initials="U"
    username="User"
    extra="user&#64;testmodeller.io"
    aria-label="Open user menu">
    <ix-dropdown-item [icon]="icons.profile" label="Profile" (click)="open('/profile')" />
    <ix-dropdown-item [icon]="icons.settings" label="Settings" (click)="open('/settings')" />
    <ix-divider />
    <ix-dropdown-item [icon]="icons.signOut" label="Sign out" (click)="signOut()" />
  </ix-avatar>
</ix-application-header>
