<header class="topbar" role="banner">

  <!-- Left: hamburger (mobile) + breadcrumb -->
  <div class="topbar__left">
    <!-- Hamburger shown only when sidenav hidden on small screens -->
    <button class="topbar__menu-btn" aria-label="Toggle navigation" (click)="menuClick.emit()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>

    <!-- Cockpit: breadcrumb trail -->
    <tm-breadcrumb />
  </div>

  <!-- Right: global actions + user avatar -->
  <div class="topbar__right" role="toolbar" aria-label="Global actions">

    <!-- Search shortcut -->
    <button class="topbar__icon-btn" aria-label="Global search (⌘K)" title="Search (⌘K)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
    </button>

    <!-- Notifications -->
    <button class="topbar__icon-btn" aria-label="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
    </button>

    <div class="topbar__divider" aria-hidden="true"></div>

    <!-- User avatar / profile button -->
    <div class="topbar__user-wrap" style="position: relative;">
      <button
        class="topbar__avatar-btn"
        [attr.aria-expanded]="userMenuOpen()"
        aria-haspopup="true"
        aria-label="Open user menu"
        (click)="toggleUserMenu()">
        <span class="topbar__avatar" aria-hidden="true">U</span>
        <svg class="topbar__avatar-chevron" width="12" height="12" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>

      <!-- Dropdown -->
      <tm-user-menu [open]="userMenuOpen()" (close)="closeUserMenu()" />
    </div>

  </div>
</header>
