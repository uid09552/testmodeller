@if (open()) {
  <div #panel class="user-menu" role="menu" aria-label="User menu">
    <div class="user-menu__header">
      <div class="user-menu__avatar" aria-hidden="true">U</div>
      <div>
        <div class="user-menu__name">User</div>
        <div class="user-menu__email">user&#64;testmodeller.io</div>
      </div>
    </div>
    <hr class="user-menu__divider" />
    <ul>
      <li>
        <a class="user-menu__item" routerLink="/profile" role="menuitem" (click)="close.emit()">
          <!-- person icon -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" />
          </svg>
          Profile
        </a>
      </li>
      <li>
        <a class="user-menu__item" routerLink="/settings" role="menuitem" (click)="close.emit()">
          <!-- cog icon -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37 1 .608 2.296.07 2.572-1.065zM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
          </svg>
          Settings
        </a>
      </li>
    </ul>
    <hr class="user-menu__divider" />
    <ul>
      <li>
        <button class="user-menu__item user-menu__item--danger" role="menuitem" (click)="close.emit()">
          <!-- logout icon -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
          </svg>
          Sign out
        </button>
      </li>
    </ul>
  </div>
}
