<ix-menu
  applicationName="TestModeller"
  start-expanded
  i18nExpand="Expand navigation"
  i18nCollapse="Collapse navigation"
  (expandChange)="onExpandChange($event)">

  <!-- The project tree is the nav's main content (ADR 0004); the items below
       it are the cross-cutting views. -->
  @if (showTree()) {
    <div class="sidenav__tree" role="region" aria-label="Projects">
      <tm-explorer-tree />
    </div>
  }

  @for (item of navItems; track item.route) {
    <ix-menu-item
      [icon]="item.icon"
      [label]="item.label"
      [routerLink]="item.route"
      routerLinkActive
      #rla="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: !!item.exact }"
      [active]="rla.isActive"
      [attr.aria-label]="item.label"></ix-menu-item>
  }

  @for (item of bottomItems; track item.route) {
    <ix-menu-item
      slot="bottom"
      [icon]="item.icon"
      [label]="item.label"
      [routerLink]="item.route"
      routerLinkActive
      #rla="routerLinkActive"
      [active]="rla.isActive"
      [attr.aria-label]="item.label"></ix-menu-item>
  }
</ix-menu>
